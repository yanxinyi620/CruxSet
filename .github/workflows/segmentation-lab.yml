name: Segmentation Lab runner

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Cloud task identifier
        required: true
        type: string
      attempt_id:
        description: Cloud task attempt identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LAB_API_URL: ${{ secrets.LAB_API_URL }}
      LAB_RUNNER_KEY: ${{ secrets.LAB_RUNNER_KEY }}
      LAB_TASK_ID: ${{ inputs.task_id }}
      LAB_ATTEMPT_ID: ${{ inputs.attempt_id }}
      LAB_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      SEG_LAB_SAM2_MODEL: facebook/sam2.1-hiera-large
      SEG_LAB_SAM2_REVISION: 665f8e2ad61cf5f53d65644ff27c8ee525124610
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: sam2-${{ runner.os }}-665f8e2ad61cf5f53d65644ff27c8ee525124610
      - name: Install runner
        working-directory: tools/segmentation-lab
        run: uv sync --locked --extra sam2
      - name: Run claimed task
        working-directory: tools/segmentation-lab
        run: uv run --no-sync python -m segmentation_lab.cloud_runner
