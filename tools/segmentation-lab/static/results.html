<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Spraywall 查看器</title><style>:root{--ink:#17211d;--paper:#f2f0e8;--line:#b9c4b9;--lime:#a7e75d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Georgia,'Noto Serif SC',serif}.bar{height:72px;position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:0 28px;background:#fffdf7;border-bottom:1px solid var(--line)}.brand{font-weight:bold;letter-spacing:1px;margin-right:auto}.bar a{color:#276b49}.bar button{padding:8px 12px;border:1px solid var(--ink);background:var(--lime);font:700 13px system-ui;cursor:pointer}.stage{position:relative;height:calc(100vh - 72px);overflow:hidden;cursor:grab;background:radial-gradient(#dbe5d5 1px,transparent 1px);background-size:20px 20px}.wall{position:absolute;transform-origin:0 0;box-shadow:8px 8px 0 #b9c4b988}.wall img{display:block}.wall svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}path{fill:#77c94b44;stroke:#3d8b38;stroke-width:3;vector-effect:non-scaling-stroke}</style><body><div class="bar"><span class="brand">SPRAYWALL / LAB</span><a href="/">← 实验档案</a><button onclick="reset()">重置视图</button><span id="info">正在加载…</span></div><div class="stage" id="stage"><div class="wall" id="wall"><img id="image"><svg id="overlay"></svg></div></div><script>const id=location.pathname.split('/').pop(),query=new URLSearchParams(location.search),original=query.get('mode')==='original',source=query.get('source')||'sam2',img=image,svg=overlay,stage=document.querySelector('#stage'),wall=document.querySelector('#wall'),info=document.querySelector('#info');let s=.22,x=0,y=0,d;function paint(){wall.style.transform=`translate(${x}px,${y}px) scale(${s})`}function reset(){s=Math.min(.8,stage.clientWidth/img.naturalWidth,stage.clientHeight/img.naturalHeight);x=(stage.clientWidth-img.naturalWidth*s)/2;y=(stage.clientHeight-img.naturalHeight*s)/2;paint()}stage.onwheel=e=>{e.preventDefault();let r=stage.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,n=Math.max(.05,Math.min(3,s*(e.deltaY<0?1.15:1/1.15)));x=px-(px-x)*n/s;y=py-(py-y)*n/s;s=n;paint()};stage.onpointerdown=e=>{d=[e.clientX,e.clientY,x,y];stage.setPointerCapture(e.pointerId)};stage.onpointermove=e=>{if(d){x=d[2]+e.clientX-d[0];y=d[3]+e.clientY-d[1];paint()}};stage.onpointerup=()=>d=null;img.src='/api/experiments/'+id+'/image';img.onload=async()=>{wall.style.width=img.naturalWidth+'px';wall.style.height=img.naturalHeight+'px';svg.setAttribute('viewBox',`0 0 ${img.naturalWidth} ${img.naturalHeight}`);reset();if(original){info.textContent='原图 · 滚轮缩放，拖动平移';return}let data=await(await fetch('/api/experiments/'+id+'/candidates?source='+encodeURIComponent(source))).json();svg.innerHTML=data.items.map(a=>`<path d="M ${a.polygon.map(p=>p.join(',')).join(' L ')} Z"/>`).join('');info.textContent=data.items.length+' 个候选 · 滚轮缩放，拖动平移'};window.onresize=()=>{if(img.complete&&img.naturalWidth)reset()}</script></body></html>
