<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Spraywall Lab</title><style>
:root{--ink:#17211d;--paper:#f2f0e8;--line:#b9c4b9;--lime:#a7e75d;--card:#fffdf7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Georgia,'Noto Serif SC',serif}.shell{max-width:1120px;margin:auto;padding:36px 24px}header{border-bottom:2px solid var(--ink);padding-bottom:20px}h1{margin:0;font-size:42px}.step{margin-top:22px;padding:20px;background:var(--card);border:1px solid var(--line);box-shadow:5px 5px #cbd5c9}.head{display:flex;align-items:center;gap:12px}.num{background:var(--lime);padding:5px 8px;font:700 20px system-ui}h2{margin:0;font-size:22px}.sub{margin-left:auto;color:#536158}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.file,select,input{padding:9px 12px;border:1px solid var(--ink);background:#fffdf7;font:14px system-ui}.file,button.primary{background:var(--lime);font-weight:bold}.file input{display:none}button{cursor:pointer}button:disabled{opacity:.4}#preview{display:none;max-width:100%;max-height:300px;margin-top:14px;border:1px solid var(--line)}.notice{display:none;margin-top:12px;padding:10px;background:#e5f5d4}.collapse{display:none;margin-top:12px;border-top:1px solid var(--line)}.collapse.open{display:block}.image-list a{display:block;color:#276b49;padding:10px 0;border-bottom:1px solid var(--line)}.models,.fields{display:grid;gap:9px;margin-top:14px}.models{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:repeat(5,1fr)}.fields label{font:12px system-ui;color:#536158}.fields input{width:100%;margin-top:4px}.runner{display:none}.runner.open{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}@media(max-width:720px){.fields{grid-template-columns:repeat(2,1fr)}.models{grid-template-columns:1fr}}</style></head>
<body><main class="shell"><header><h1>SPRAYWALL / LAB</h1><div>固定墙岩点分割实验台</div></header>
<section class="step"><div class="head"><span class="num">01</span><h2>导入图片</h2><span class="sub" id="count"></span></div><div class="row"><label class="file">选择墙图<input id="image" type="file" accept="image/png,image/jpeg"></label><button id="upload" class="primary" disabled>导入原图</button></div><p id="previewHint">选择 JPG 或 PNG 后，在这里确认预览。</p><img id="preview"><div id="notice" class="notice"></div><div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><button onclick="toggleImages()">原图列表</button><div id="images" class="collapse image-list"></div></div></section>
<section class="step"><div class="head"><span class="num">02</span><h2>选择模型</h2><span class="sub" id="modelCount"></span></div><div id="models" class="models"></div><div id="runner" class="runner"><div class="row"><select id="source"></select><button onclick="preset('base')">基线</button><button onclick="preset('recall')">少漏检</button><button onclick="preset('dense')">密集墙</button></div><div class="fields"><label>点密度<input id="pps" value="48"></label><label>批量<input id="ppb" value="8"></label><label>IoU<input id="iou" value=".85"></label><label>稳定度<input id="stable" value=".90"></label><label>裁剪层<input id="crop" value="1"></label></div><p><button class="primary" onclick="run()">确认并运行</button></p></div></section>
<section class="step"><div class="head"><span class="num">03</span><h2>分割结果</h2><span class="sub" id="taskCount"></span></div><table class="table"><thead><tr><th>任务名称</th><th>原图</th><th>模型</th><th>时间</th><th>状态</th><th>结果</th></tr></thead><tbody id="tasks"></tbody></table></section></main>
<script>let items=[],model,selected;const input=document.querySelector('#image'),upload=document.querySelector('#upload'),preview=document.querySelector('#preview'),previewHint=document.querySelector('#previewHint'),notice=document.querySelector('#notice'),images=document.querySelector('#images'),count=document.querySelector('#count'),modelCount=document.querySelector('#modelCount'),taskCount=document.querySelector('#taskCount'),models=document.querySelector('#models'),runner=document.querySelector('#runner'),source=document.querySelector('#source'),tasks=document.querySelector('#tasks');function msg(t){notice.textContent=t;notice.style.display='block'}input.onchange=()=>{selected=input.files[0];upload.disabled=!selected;if(selected){preview.src=URL.createObjectURL(selected);preview.style.display='block';previewHint.style.display='none';msg('预览已就绪，确认后导入原图。')}};function toggleImages(){images.classList.toggle('open')}async function load(){let p=await(await fetch('/api/experiments')).json();items=p.items;count.textContent=`已导入 ${items.length} 张`;images.innerHTML=items.map(x=>`<a href="/results/${x.id}?mode=original">${x.image.name} · ${x.createdAt?new Date(x.createdAt*1000).toLocaleString():'历史记录'}</a>`).join('')||'尚无原图';source.innerHTML=items.map(x=>`<option value="${x.id}">${x.image.name}</option>`).join('');let runs=items.flatMap(x=>Object.entries(x.runs).map(([m,r])=>({x,m,r}))),completed=runs.filter(({r})=>r.status==='succeeded').length;taskCount.textContent=`已完成 ${completed} 个任务`;tasks.innerHTML=runs.map(({x,m,r})=>`<tr><td>${x.image.name} / ${m}</td><td><a href="/results/${x.id}?mode=original">查看</a></td><td>${m}</td><td>${r.updatedAt?new Date(r.updatedAt*1000).toLocaleString():'—'}</td><td>${r.status}</td><td>${r.status==='succeeded'?`<a href="/results/${x.id}?source=${m}">查看结果</a>`:'—'}</td></tr>`)).join('')||'<tr><td colspan="6">尚无分割任务</td></tr>'}async function loadModels(){let p=await(await fetch('/api/models')).json(),available=p.items.filter(x=>x.available).length;modelCount.textContent=`可用 ${available} 个模型`;models.innerHTML=p.items.map(x=>`<button ${x.available?'':'disabled'} onclick="choose('${x.name}')">${x.name}<br><small>${x.available?'可用':'不可用：'+x.reason}</small></button>`).join('')}function choose(n){model=n;runner.classList.add('open')}const sets={base:[48,8,.85,.9,1],recall:[64,4,.78,.85,1],dense:[64,4,.78,.82,2]};function preset(k){[pps.value,ppb.value,iou.value,stable.value,crop.value]=sets[k]}async function run(){let q={points_per_side:+pps.value,points_per_batch:+ppb.value,pred_iou_thresh:+iou.value,stability_score_thresh:+stable.value,crop_n_layers:+crop.value};msg(`${model} 正在 CPU 上运行…`);await fetch('/api/experiments/'+source.value+'/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,parameters:q})});load()}upload.onclick=async()=>{let f=new FormData();f.append('image',selected);msg('正在导入…');let r=await fetch('/api/experiments',{method:'POST',body:f});msg(r.ok?'原图已导入':'导入失败');load()};load();loadModels();</script></body></html>
