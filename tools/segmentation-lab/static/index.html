<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>Spraywall Lab</title
  ><style>
    :root {
      --i: #17211d;
      --p: #f2f0e8;
      --l: #b9c4b9;
      --g: #a7e75d;
      --c: #fffdf7;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--p);
      color: var(--i);
      font:
        16px Georgia,
        "Noto Serif SC",
        serif;
    }
    .shell {
      max-width: 1120px;
      margin: auto;
      padding: 32px 24px;
    }
    header {
      border-bottom: 2px solid var(--i);
      padding-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 40px;
    }
    .step {
      margin-top: 20px;
      padding: 20px;
      background: var(--c);
      border: 1px solid var(--l);
      box-shadow: 5px 5px #cbd5c9;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .num {
      background: var(--g);
      padding: 5px 8px;
      font: 700 20px system-ui;
    }
    h2 {
      margin: 0;
      font-size: 22px;
    }
    .sub {
      margin-left: auto;
      color: #536158;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button,
    input,
    select {
      padding: 9px 12px;
      border: 1px solid var(--i);
      background: var(--c);
      font: 14px system-ui;
      cursor: pointer;
    }
    .primary {
      background: var(--g);
      font-weight: bold;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    .table th,
    .table td {
      text-align: left;
      padding: 9px;
      border-bottom: 1px solid var(--l);
    }
    a {
      color: #276b49;
    }
    .danger {
      width: auto;
      padding: 6px 10px;
      color: #8e302b;
      border-color: #dfaaa4;
      background: #fff4f2;
      font-size: 12px;
    }
    .danger:hover {
      color: #fff;
      background: #b84a43;
      border-color: #b84a43;
    }
    #preview { display:none; max-width:100%; max-height:360px; margin-top:14px; border:1px solid var(--l); }
    #crop { display:none; max-width:100%; margin-top:14px; border:1px solid var(--l); cursor:crosshair; touch-action:none; }
    .confirm {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      background: #17211d55;
    }
    .confirm.open { display: flex; }
    .confirm-card {
      width: min(380px, calc(100vw - 40px));
      padding: 22px;
      background: var(--c);
      border: 1px solid var(--i);
      box-shadow: 7px 7px #17211d;
    }
    .confirm-card h2 { margin: 0; font-size: 20px; }
    .confirm-card p { color: #536158; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 9px; justify-content: flex-end; }
    .confirm-actions button { width: auto; }
    .confirm-actions .confirm-delete { background: #b84a43; border-color: #b84a43; color: #fff; }
    .run-modal { display:none; position:fixed; inset:0; z-index:9; align-items:center; justify-content:center; background:#17211d55; }
    .run-modal.open { display:flex; }
    .run-card { width:min(520px,calc(100vw - 40px)); padding:22px; background:var(--c); border:1px solid var(--i); box-shadow:7px 7px #17211d; }
    .run-card label { display:block; margin:10px 0; font:13px system-ui; }
    .run-card select,.run-card input { width:100%; margin-top:4px; }
    #runFields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 10px; }
    #runFields label { min-width:0; }
    }
    @media (max-width: 700px) {
      .table {
        font-size: 12px;
      }
      .table th,
      .table td {
        padding: 6px;
      }
    }
  </style>
  <body>
    <main class="shell">
      <header>
        <h1>SPRAYWALL / LAB</h1>
        <div>固定墙岩点分割实验台</div>
      </header>
      <section class="step">
        <div class="head">
          <span class="num">01</span>
          <h2>导入图片</h2>
          <span id="count" class="sub"></span>
        </div>
        <div class="row" style="margin-top: 14px">
          <input id="file" type="file" accept="image/png,image/jpeg" /><button
            id="upload"
            class="primary"
          >
            校正并导入
          </button>
          <button id="resetCrop" style="display:none">重选角点</button>
        </div>
        <p id="previewHint">选择 JPG 或 PNG 后，在这里确认预览。</p>
        <p id="cropHint" style="display:none">点击图片添加角点，拖动圆点微调；至少选择 3 个角点后，校正并导入会保留闭合区域。</p>
        <img id="preview" alt="墙图预览" />
        <canvas id="crop"></canvas>
        <table class="table">
          <thead>
            <tr>
              <th>原图名称</th>
              <th>上传时间</th>
              <th>大小</th>
              <th>删除</th>
            </tr>
          </thead>
          <tbody id="images"></tbody>
        </table>
      </section>
      <section class="step">
        <div class="head">
          <span class="num">02</span>
          <h2>选择模型</h2>
          <span id="modelsCount" class="sub"></span>
        </div>
        <div id="models" class="row" style="margin-top: 12px"></div>
      </section>
      <section class="step">
        <div class="head">
          <span class="num">03</span>
          <h2>分割结果</h2>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th>原图</th>
              <th>模型</th>
              <th>时间</th>
              <th>状态</th>
              <th>结果</th>
              <th>删除</th>
            </tr>
          </thead>
          <tbody id="runs"></tbody>
        </table>
      </section>
      <section class="step">
        <div class="head">
          <span class="num">04</span>
          <h2>人工校准</h2>
        </div>
        <p>选择分割结果后在独立工作台进行删除、补点和保存。</p>
        <p>
          <a href="/calibrations"
            ><button class="primary">选择分割结果并开始校准</button></a
          >
        </p>
        <table class="table">
          <thead>
            <tr>
              <th>校准 ID</th>
              <th>来源任务</th>
              <th>保存时间</th>
              <th>岩点</th>
              <th>操作</th>
              <th>删除</th>
            </tr>
          </thead>
          <tbody id="calibrations"></tbody>
        </table>
      </section>
    </main>
    <div id="confirm" class="confirm" role="dialog" aria-modal="true">
      <div class="confirm-card">
        <h2>删除此记录？</h2>
        <p>删除后无法恢复。相关结果与文件将一并移除。</p>
        <div class="confirm-actions"><button onclick="closeConfirm()">取消</button><button id="confirmDelete" class="confirm-delete">确认删除</button></div>
      </div>
    </div>
    <div id="runModal" class="run-modal" role="dialog" aria-modal="true"><div class="run-card"><h2 id="runTitle">配置分割任务</h2><label>墙图<select id="runImage"></select></label><div class="row"><button onclick="preset('base')">基线</button><button onclick="preset('recall')">少漏检</button><button onclick="preset('dense')">密集墙</button></div><div id="runFields"><label>点密度<input id="runPoints" value="48" type="number"></label><label>批量<input id="runBatch" value="8" type="number"></label><label>IoU<input id="runIou" value="0.85" step=".01" type="number"></label><label>稳定度<input id="runStable" value="0.90" step=".01" type="number"></label><label>裁剪层<input id="runCrop" value="0" type="number"></label></div><p id="runCropNote" class="note"></p><div class="confirm-actions"><button onclick="closeRun()">取消</button><button id="runConfirm" class="primary">确认并运行</button></div></div></div>
    <script>
      const $ = (s) => document.querySelector(s);
      let pendingDelete;
      let selectedModel;
      const presets={base:[48,8,.85,.90,1],recall:[64,4,.78,.85,1],dense:[64,4,.78,.82,2]};
      function time(v) {
        return v ? new Date(v * 1000).toLocaleString() : "—";
      }
      function displayName(name) {
        return name.replace(/\.(?:png|jpe?g)$/i, "");
      }
      function del(url) { pendingDelete = url; $("#confirm").classList.add("open"); }
      function closeConfirm() { pendingDelete = undefined; $("#confirm").classList.remove("open"); }
      $("#confirmDelete").onclick = async () => {
        if (!pendingDelete) return;
        await fetch(pendingDelete, { method: "DELETE" });
        closeConfirm();
        load();
      };
      async function load() {
        let d = await (await fetch("/api/experiments")).json(),
          all = d.items;
        $("#count").textContent = `已导入 ${all.length} 张`;
        $("#images").innerHTML =
          all
            .map(
              (e) =>
                `<tr><td><a href="/results/${e.id}?mode=original">${displayName(e.image.name)}</a></td><td>${time(e.createdAt)}</td><td>${e.image.width} × ${e.image.height}</td><td><button class="danger" onclick="del('/api/experiments/${e.id}')">删除</button></td></tr>`,
            )
            .join("") || '<tr><td colspan="4">尚无原图</td></tr>';
        let runs = all.flatMap((e) =>
          Object.entries(e.runs).map(([id, r]) => ({ e, id, r })),
        );
        $("#runs").innerHTML =
          runs
            .map(
              ({ e, id, r }) =>
                `<tr><td><a href="/results/${e.id}?mode=original">${displayName(e.image.name)}</a></td><td>${r.model || id}</td><td>${time(r.updatedAt)}</td><td>${r.status === "running" ? `运行中 ${Math.round((r.progress || 0) * 100)}% · ${r.message || "启动中"}` : r.status}</td><td>${r.status === "succeeded" ? `<a href="/results/${e.id}?source=${id}">查看</a>` : "—"}</td><td><button class="danger" onclick="del('/api/experiments/${e.id}/runs/${id}')">删除</button></td></tr>`,
            )
            .join("") || '<tr><td colspan="6">尚无任务</td></tr>';
        let c = await (await fetch("/api/calibrations")).json();
        $("#calibrations").innerHTML =
          c.items
            .map(
              (x) =>
                `<tr><td>${x.id.slice(0, 8)}</td><td>${x.sourceTaskId.slice(0, 8)}</td><td>${time(x.updatedAt)}</td><td>${x.candidateCount}</td><td><a href="/calibrations">继续校准</a> · <a href="/api/experiments/${x.experimentId}/calibrations/${x.id}/export.svg">SVG</a></td><td><button class="danger" onclick="del('/api/experiments/${x.experimentId}/calibrations/${x.id}')">删除</button></td></tr>`,
            )
            .join("") || '<tr><td colspan="6">尚无校准结果</td></tr>';
      }
      async function models() {
        let d = await (await fetch("/api/models")).json();
        $("#modelsCount").textContent =
          `可用 ${d.items.filter((x) => x.available).length} 个模型`;
        $("#models").innerHTML = d.items
          .map(
            (x) =>
              `<button ${x.available ? `onclick="openRun('${x.name}')"` : "disabled"}>${x.name}${x.available ? "" : "（不可用）"}</button>`,
          )
          .join("");
      }
      function applyModelRules(){let runCrop=$("#runCrop"),restricted=selectedModel==="sam2"||selectedModel==="sam2_tiled";runCrop.disabled=restricted;if(restricted)runCrop.value=0;$("#runCropNote").textContent=selectedModel==="sam2_tiled"?"已启用 2×2 重叠分块；不使用模型内部裁剪层。":selectedModel==="sam2"?"当前 SAM2 自动裁剪层固定为 0，以确保任务稳定运行。":""}
      function preset(name){[$("#runPoints").value,$("#runBatch").value,$("#runIou").value,$("#runStable").value,$("#runCrop").value]=presets[name];applyModelRules()}
      function openRun(model) { selectedModel=model; preset("base"); $("#runTitle").textContent=`配置 ${model}`; fetch("/api/experiments").then(r=>r.json()).then(d=>{$("#runImage").innerHTML=d.items.map(e=>`<option value="${e.id}">${displayName(e.image.name)}</option>`).join("")}); $("#runModal").classList.add("open"); }
      function closeRun() { $("#runModal").classList.remove("open"); }
      $("#runConfirm").onclick=async()=>{ let id=$("#runImage").value; if(!id)return; let cropLayers=selectedModel==="sam2"||selectedModel==="sam2_tiled"?0:+$("#runCrop").value; await fetch(`/api/experiments/${id}/runs`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:selectedModel,parameters:{points_per_side:+$("#runPoints").value,points_per_batch:+$("#runBatch").value,pred_iou_thresh:+$("#runIou").value,stability_score_thresh:+$("#runStable").value,crop_n_layers:cropLayers}})}); closeRun(); load(); };
      let cropImage, cropPoints=[], dragCropPoint;
      const cropCanvas=$("#crop"), cropCtx=cropCanvas.getContext("2d");
      function cropCanvasPoint(event){let r=cropCanvas.getBoundingClientRect();return [Math.max(0,Math.min(cropImage.naturalWidth,(event.clientX-r.left)*cropImage.naturalWidth/r.width)),Math.max(0,Math.min(cropImage.naturalHeight,(event.clientY-r.top)*cropImage.naturalHeight/r.height))]}
      function drawCrop(){if(!cropImage)return;cropCtx.clearRect(0,0,cropCanvas.width,cropCanvas.height);cropCtx.drawImage(cropImage,0,0,cropCanvas.width,cropCanvas.height);let scaleX=cropCanvas.width/cropImage.naturalWidth,scaleY=cropCanvas.height/cropImage.naturalHeight;cropCtx.strokeStyle="#a7e75d";cropCtx.fillStyle="#17211d";cropCtx.lineWidth=3;if(cropPoints.length){cropCtx.beginPath();cropPoints.forEach((p,i)=>{let x=p[0]*scaleX,y=p[1]*scaleY;i?cropCtx.lineTo(x,y):cropCtx.moveTo(x,y)});if(cropPoints.length>=3)cropCtx.closePath();cropCtx.stroke()}cropPoints.forEach((p,i)=>{let x=p[0]*scaleX,y=p[1]*scaleY;cropCtx.beginPath();cropCtx.arc(x,y,7,0,Math.PI*2);cropCtx.fill();cropCtx.strokeStyle="#fffdf7";cropCtx.lineWidth=2;cropCtx.stroke();cropCtx.strokeStyle="#a7e75d";cropCtx.lineWidth=3});$("#upload").disabled=cropPoints.length<3;$("#cropHint").textContent=cropPoints.length<3?`点击图片添加角点，拖动圆点微调；还需 ${3-cropPoints.length} 个角点才能导入。`:`已选择 ${cropPoints.length} 个角点；校正并导入会保留闭合区域。`}
      $("#upload").onclick = async () => {
        let f = $("#file").files[0];
        if (!f || cropPoints.length<3) return;
        let xs=cropPoints.map(p=>p[0]),ys=cropPoints.map(p=>p[1]),left=Math.floor(Math.min(...xs)),top=Math.floor(Math.min(...ys)),out=document.createElement("canvas");out.width=Math.max(1,Math.ceil(Math.max(...xs))-left);out.height=Math.max(1,Math.ceil(Math.max(...ys))-top);let outCtx=out.getContext("2d");outCtx.beginPath();cropPoints.forEach((p,i)=>{i?outCtx.lineTo(p[0]-left,p[1]-top):outCtx.moveTo(p[0]-left,p[1]-top)});outCtx.closePath();outCtx.clip();outCtx.drawImage(cropImage,-left,-top);let blob=await new Promise(r=>out.toBlob(r,"image/png"));
        let form = new FormData();
        form.append("image", blob, f.name.replace(/\.[^.]+$/,"")+"-wall.png");
        await fetch("/api/experiments", { method: "POST", body: form });
        load();
      };
      $("#file").onchange = () => {
        const file = $("#file").files[0];
        if (!file) return;
        cropImage=new Image();cropImage.onload=()=>{let s=Math.min(900/cropImage.naturalWidth,600/cropImage.naturalHeight,1);cropCanvas.width=cropImage.naturalWidth*s;cropCanvas.height=cropImage.naturalHeight*s;cropCanvas.style.display="block";cropPoints=[];drawCrop();$("#resetCrop").style.display="inline-block";$("#cropHint").style.display="block"};cropImage.src=URL.createObjectURL(file);
        $("#previewHint").style.display = "none";
      };
      cropCanvas.onpointerdown=e=>{if(!cropImage)return;let point=cropCanvasPoint(e),scale=cropCanvas.width/cropImage.naturalWidth,nearest=cropPoints.findIndex(p=>Math.hypot((p[0]-point[0])*scale,(p[1]-point[1])*scale)<13);if(nearest>=0){dragCropPoint=nearest;cropCanvas.setPointerCapture(e.pointerId);return}cropPoints.push(point);drawCrop()};
      cropCanvas.onpointermove=e=>{if(dragCropPoint===undefined)return;cropPoints[dragCropPoint]=cropCanvasPoint(e);drawCrop()};
      cropCanvas.onpointerup=e=>{if(dragCropPoint!==undefined&&cropCanvas.hasPointerCapture(e.pointerId))cropCanvas.releasePointerCapture(e.pointerId);dragCropPoint=undefined};
      $("#resetCrop").onclick=()=>{cropPoints=[];drawCrop()};
      load();
      models();
    </script>
  </body>
</html>
