<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Spraywall Lab</title><style>
:root{--ink:#17211d;--paper:#f2f0e8;--line:#b9c4b9;--lime:#a7e75d;--card:#fffdf7;--muted:#536158}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Georgia,'Noto Serif SC',serif}.shell{max-width:1120px;margin:auto;padding:36px 24px}header{border-bottom:2px solid var(--ink);padding-bottom:20px}h1{margin:0;font-size:42px}.step{margin-top:22px;padding:20px;background:var(--card);border:1px solid var(--line);box-shadow:5px 5px #cbd5c9}.head{display:flex;align-items:center;gap:12px}.num{background:var(--lime);padding:5px 8px;font:700 20px system-ui}h2{margin:0;font-size:22px}.sub{margin-left:auto;color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.file,select,input{padding:9px 12px;border:1px solid var(--ink);background:#fffdf7;font:14px system-ui}.file,button.primary{background:var(--lime);font-weight:bold}.file input{display:none}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}#preview{display:none;max-width:100%;max-height:300px;margin-top:14px;border:1px solid var(--line)}.notice{display:none;margin-top:12px;padding:10px;background:#e5f5d4}.collapse{display:none;margin-top:12px;border-top:1px solid var(--line)}.collapse.open{display:block}.models,.fields{display:grid;gap:9px;margin-top:14px}.models{grid-template-columns:repeat(2,1fr)}.model{min-height:76px;text-align:left}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}a{color:#276b49}.modal{display:none;position:fixed;inset:0;z-index:10;background:#17211d66;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border:1px solid var(--ink);box-shadow:9px 9px #17211d;padding:22px}.dialog-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}.dialog-head h2{font-size:25px}.close{margin-left:auto;background:transparent;border:0;font-size:26px;padding:0 6px}.fields{grid-template-columns:repeat(5,1fr)}.fields label{font:12px system-ui;color:var(--muted)}.fields input{width:100%;margin-top:4px}.hint{color:var(--muted);font-size:14px}@media(max-width:720px){.fields{grid-template-columns:repeat(2,1fr)}.models{grid-template-columns:1fr}.table{font-size:13px}.table th,.table td{padding:8px}}
</style></head><body><main class="shell"><header><h1>SPRAYWALL / LAB</h1><div>固定墙岩点分割实验台</div></header>
<section class="step"><div class="head"><span class="num">01</span><h2>导入图片</h2><span class="sub" id="count"></span></div><div class="row" style="margin-top:14px"><label class="file">选择墙图<input id="image" type="file" accept="image/png,image/jpeg"></label><button id="upload" class="primary" disabled>导入原图</button></div><p id="previewHint">选择 JPG 或 PNG 后，在这里确认预览。</p><img id="preview"><div id="notice" class="notice"></div><div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><button onclick="toggleImages()">原图列表</button><div id="images" class="collapse"><table class="table"><thead><tr><th>原图名称</th><th>上传时间</th><th>大小</th><th>查看</th></tr></thead><tbody id="imageRows"></tbody></table></div></div></section>
<section class="step"><div class="head"><span class="num">02</span><h2>选择模型</h2><span class="sub" id="modelCount"></span></div><div id="models" class="models"></div></section>
<section class="step"><div class="head"><span class="num">03</span><h2>分割结果</h2></div><table class="table"><thead><tr><th>任务名称</th><th>原图</th><th>模型</th><th>时间</th><th>状态</th><th>结果</th></tr></thead><tbody id="tasks"></tbody></table></section></main>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><h2>配置分割任务</h2><button class="close" onclick="closeModal()">×</button></div><p class="hint" id="selectedModel"></p><label>选择原图<select id="source" style="width:100%;margin-top:7px"></select></label><div class="row" style="margin-top:16px"><button onclick="preset('base')">基线</button><button onclick="preset('recall')">少漏检</button><button onclick="preset('dense')">密集墙</button></div><div class="fields"><label>点密度<input id="pps" value="48"></label><label>批量<input id="ppb" value="8"></label><label>IoU<input id="iou" value=".85"></label><label>稳定度<input id="stable" value=".90"></label><label>裁剪层<input id="crop" value="1"></label></div><div class="row" style="margin-top:22px"><button class="primary" id="runButton" onclick="run()">确认并运行</button><button onclick="closeModal()">取消</button></div></div></div>
<script>
let items=[],model,selected,pollTimer;const input=document.querySelector('#image'),upload=document.querySelector('#upload'),preview=document.querySelector('#preview'),previewHint=document.querySelector('#previewHint'),notice=document.querySelector('#notice'),images=document.querySelector('#images'),imageRows=document.querySelector('#imageRows'),count=document.querySelector('#count'),modelCount=document.querySelector('#modelCount'),models=document.querySelector('#models'),source=document.querySelector('#source'),tasks=document.querySelector('#tasks'),modal=document.querySelector('#modal'),selectedModel=document.querySelector('#selectedModel'),runButton=document.querySelector('#runButton');const sets={base:[48,8,.85,.9,1],recall:[64,4,.78,.85,1],dense:[64,4,.78,.82,2]};function msg(t){notice.textContent=t;notice.style.display='block'}function time(v){return v?new Date(v*1000).toLocaleString():'—'}function toggleImages(){images.classList.toggle('open')}function closeModal(){modal.classList.remove('open')}function preset(k){[pps.value,ppb.value,iou.value,stable.value,crop.value]=sets[k]}function choose(name){if(!items.length){msg('请先导入一张墙图，再配置分割任务。');return}model=name;selectedModel.textContent=`模型：${name.toUpperCase()} · 请确认原图与参数`;modal.classList.add('open')}function updatePolling(runs){let running=runs.some(({r})=>r.status==='running');if(running&&!pollTimer)pollTimer=setInterval(load,15000);if(!running&&pollTimer){clearInterval(pollTimer);pollTimer=null}}async function load(){let r=await fetch('/api/experiments');if(!r.ok)return;let p=await r.json();items=p.items;count.textContent=`已导入 ${items.length} 张`;imageRows.innerHTML=items.map(x=>`<tr><td>${x.image.name}</td><td>${time(x.createdAt)}</td><td>${x.image.width} × ${x.image.height}</td><td><a href="/results/${x.id}?mode=original">查看原图</a></td></tr>`).join('')||'<tr><td colspan="4">尚无原图</td></tr>';source.innerHTML=items.map(x=>`<option value="${x.id}">${x.image.name}</option>`).join('');let runs=items.flatMap(x=>Object.entries(x.runs).map(([m,r])=>({x,m,r})));updatePolling(runs);tasks.innerHTML=runs.map(({x,m,r})=>`<tr><td>${x.image.name} / ${m}</td><td><a href="/results/${x.id}?mode=original">查看</a></td><td>${m}</td><td>${time(r.updatedAt)}</td><td>${r.status==='running'?'运行中':r.status==='succeeded'?'已完成':'失败'}</td><td>${r.status==='succeeded'?`<a href="/results/${x.id}?source=${m}">查看结果</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">尚无分割任务</td></tr>'}async function loadModels(){let r=await fetch('/api/models');if(!r.ok)return;let p=await r.json(),available=p.items.filter(x=>x.available).length;modelCount.textContent=`可用 ${available} 个模型`;models.innerHTML=p.items.map(x=>`<button class="model" ${x.available?'':'disabled'} onclick="choose('${x.name}')">${x.name.toUpperCase()}<br><small>${x.available?'可用':'不可用：'+x.reason}</small></button>`).join('')}async function run(){let parameters={points_per_side:+pps.value,points_per_batch:+ppb.value,pred_iou_thresh:+iou.value,stability_score_thresh:+stable.value,crop_n_layers:+crop.value};runButton.disabled=true;let r=await fetch(`/api/experiments/${source.value}/runs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,parameters})});runButton.disabled=false;if(!r.ok){msg('任务创建失败，请检查模型状态后重试。');return}closeModal();msg(`${model.toUpperCase()} 任务已创建，正在 CPU 上运行。`);await load()}input.onchange=()=>{selected=input.files[0];upload.disabled=!selected;if(selected){preview.src=URL.createObjectURL(selected);preview.style.display='block';previewHint.style.display='none';msg('预览已就绪，确认后导入原图。')}};upload.onclick=async()=>{let f=new FormData();f.append('image',selected);msg('正在导入…');let r=await fetch('/api/experiments',{method:'POST',body:f});msg(r.ok?'原图已导入':'导入失败');await load()};modal.onclick=e=>{if(e.target===modal)closeModal()};load();loadModels();
</script><script>async function refreshTaskTable(){const response=await fetch('/api/experiments');if(!response.ok)return;const data=await response.json();const runs=data.items.flatMap(x=>Object.entries(x.runs).map(([taskId,run])=>({x,taskId,run})));tasks.innerHTML=runs.map(({x,taskId,run})=>`<tr><td>${taskId.slice(0,8)}</td><td><a href="/results/${x.id}?mode=original">查看</a></td><td>${run.model||taskId}</td><td>${time(run.updatedAt)}</td><td>${run.status==='running'?'运行中':run.status==='succeeded'?'已完成':'失败'}</td><td>${run.status==='succeeded'?`<a href="/results/${x.id}?source=${taskId}">查看结果</a>`:'—'}</td></tr>`).join('')||'<tr><td colspan="6">尚无分割任务</td></tr>'}const previousLoad=load;load=async()=>{await previousLoad();await refreshTaskTable()};const previousRun=run;run=async()=>{await previousRun();await refreshTaskTable()};refreshTaskTable();</script></body></html>
