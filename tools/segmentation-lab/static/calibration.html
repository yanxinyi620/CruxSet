<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>人工校准</title>
<style>
:root{--i:#17211d;--p:#f2f0e8;--l:#b9c4b9;--g:#a7e75d;--c:#fffdf7}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px Georgia,'Noto Serif SC',serif}.bar{height:68px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--c);border-bottom:2px solid var(--i)}.bar b{margin-right:auto}.bar a{color:#276b49}.app{height:calc(100vh - 68px);display:grid;grid-template-columns:290px 1fr}.side{overflow:auto;padding:16px;background:var(--c);border-right:1px solid var(--l)}h1{font-size:24px;margin:0 0 14px}.group{margin-top:15px;padding-top:12px;border-top:1px solid var(--l)}button,select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--i);background:var(--c);font:13px system-ui;cursor:pointer}.primary,.active{background:var(--g);font-weight:bold}.note{font:12px system-ui;color:#536158;line-height:1.5}.stage{position:relative;overflow:hidden;background:radial-gradient(#dbe5d5 1px,transparent 1px);background-size:20px 20px;cursor:grab}.wall{position:absolute;transform-origin:0 0;box-shadow:8px 8px #b9c4b988}.wall img{display:block}.wall svg{position:absolute;inset:0;width:100%;height:100%}polygon{fill:#77c94b44;stroke:#3d8b38;stroke-width:3;vector-effect:non-scaling-stroke;cursor:pointer}polygon.selected{fill:#e9857c77;stroke:#c84d45}.draft{fill:#a7e75d55;stroke:#17211d;stroke-width:3;vector-effect:non-scaling-stroke}@media(max-width:800px){.app{height:auto;grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--l)}.stage{height:70vh}}
</style>
<body>
<div class="bar"><b>SPRAYWALL / LAB</b><a href="/">← 实验档案</a><span>04 / 人工校准</span></div>
<main class="app"><aside class="side"><h1>人工校准</h1><label>来源分割结果<select id="task"></select></label><button id="load" class="primary">加载候选</button><p id="status" class="note">选择一条已完成任务。</p><div class="group"><b>编辑工具</b><button id="select" class="active">选择 / 删除</button><button id="add">新增岩点</button><button id="finish" disabled>完成新增边界</button><button id="delete">删除选中岩点</button><button id="reset">重置视图</button></div><div class="group"><button id="save" class="primary">保存为校准结果</button></div></aside><section id="stage" class="stage"><div id="wall" class="wall"><img id="image"><svg id="overlay"></svg></div></section></main>
<script>
let jobs=[],eid,tid,items=[],selected,mode='select',draft=[],zoom=.22,x=28,y=28,drag;
const q=s=>document.querySelector(s),task=q('#task'),image=q('#image'),wall=q('#wall'),overlay=q('#overlay'),stage=q('#stage'),params=new URLSearchParams(location.search);
function msg(text){q('#status').textContent=text}
function paint(){wall.style.transform=`translate(${x}px,${y}px) scale(${zoom})`}
function render(){overlay.innerHTML=items.map(a=>`<polygon class="${a.id===selected?'selected':''}" data-id="${a.id}" points="${a.polygon.map(p=>p.join(',')).join(' ')}"/>`).join('')+(draft.length?`<polyline class="draft" points="${draft.map(p=>p.join(',')).join(' ')}"/>`:'');overlay.querySelectorAll('polygon').forEach(p=>p.onclick=()=>{if(mode==='select'){selected=p.dataset.id;render()}})}
function showWall(){return new Promise(resolve=>{image.onload=()=>{wall.style.width=image.naturalWidth+'px';wall.style.height=image.naturalHeight+'px';overlay.setAttribute('viewBox',`0 0 ${image.naturalWidth} ${image.naturalHeight}`);paint();render();resolve()};image.src=`/api/experiments/${eid}/image`})}
async function boot(){let data=await(await fetch('/api/experiments')).json();jobs=data.items.flatMap(e=>Object.entries(e.runs).filter(([,r])=>r.status==='succeeded').map(([id,r])=>({e,id,r})));task.innerHTML=jobs.map((j,index)=>`<option value="${index}">${j.e.image.name} · ${j.r.model||j.id}</option>`).join('')}
async function load(){let job=jobs[task.value];if(!job)return;eid=job.e.id;tid=job.id;items=(await(await fetch(`/api/experiments/${eid}/candidates?source=${tid}`)).json()).items;await showWall();msg(`已加载 ${items.length} 个候选。`)}
async function resumeCalibration(){let experimentId=params.get('experiment'),calibrationId=params.get('calibration');if(!experimentId||!calibrationId)return;let records=await(await fetch(`/api/experiments/${experimentId}/calibrations`)).json(),record=records.items.find(item=>item.id===calibrationId);if(!record){msg('未找到要继续的校准结果。');return}eid=experimentId;tid=record.sourceTaskId;let jobIndex=jobs.findIndex(job=>job.e.id===eid&&job.id===tid);if(jobIndex>=0)task.value=jobIndex;items=(await(await fetch(`/api/experiments/${eid}/calibrations/${calibrationId}`)).json()).items;await showWall();msg(`已恢复校准结果（${items.length} 个岩点），可继续修改后另存。`)}
q('#load').onclick=load;q('#select').onclick=()=>{mode='select';draft=[];render()};q('#add').onclick=()=>{mode='add';draft=[];msg('在画布点击至少三点勾勒岩点。')};overlay.onclick=event=>{if(mode!=='add'||event.target!==overlay)return;let rect=overlay.getBoundingClientRect();draft.push([Math.round((event.clientX-rect.left)*image.naturalWidth/rect.width),Math.round((event.clientY-rect.top)*image.naturalHeight/rect.height)]);q('#finish').disabled=draft.length<3;render()};q('#finish').onclick=()=>{items.push({id:`manual-${crypto.randomUUID()}`,polygon:draft});draft=[];q('#finish').disabled=true;render()};q('#delete').onclick=()=>{items=items.filter(item=>item.id!==selected);selected=null;render()};q('#save').onclick=async()=>{let response=await fetch(`/api/experiments/${eid}/calibrations`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceTaskId:tid,candidates:items,changes:{}})});msg(response.ok?'已保存为独立校准结果。':'保存失败。')};stage.onwheel=event=>{event.preventDefault();let rect=stage.getBoundingClientRect(),px=event.clientX-rect.left,py=event.clientY-rect.top,next=Math.max(.05,Math.min(3,zoom*(event.deltaY<0?1.15:1/1.15)));x=px-(px-x)*next/zoom;y=py-(py-y)*next/zoom;zoom=next;paint()};stage.onpointerdown=event=>{drag=[event.clientX,event.clientY,x,y]};stage.onpointermove=event=>{if(drag){x=drag[2]+event.clientX-drag[0];y=drag[3]+event.clientY-drag[1];paint()}};stage.onpointerup=()=>drag=null;q('#reset').onclick=()=>{zoom=.22;x=28;y=28;paint()};boot().then(resumeCalibration);
</script>
</body>
</html>
