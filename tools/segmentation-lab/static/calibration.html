<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>人工校准 · Spraywall Lab</title><style>:root{--ink:#17211d;--paper:#f2f0e8;--line:#b9c4b9;--lime:#a7e75d;--card:#fffdf7;--red:#c84d45}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Georgia,'Noto Serif SC',serif}.bar{height:68px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--card);border-bottom:2px solid var(--ink)}.brand{font-weight:bold;letter-spacing:1px;margin-right:auto}.bar a{color:#276b49}.shell{max-width:1320px;margin:auto;padding:20px}.head{display:flex;align-items:center;gap:12px}.num{background:var(--lime);padding:5px 8px;font:700 20px system-ui}h1{margin:0;font-size:25px}.grid{display:grid;grid-template-columns:230px 1fr 220px;gap:14px;margin-top:16px}.panel,.stage{background:var(--card);border:1px solid var(--line);box-shadow:4px 4px #cbd5c9;padding:14px}.stage{padding:0;min-height:600px;position:relative;overflow:auto;background:#dfe7d9}.wall{position:relative;transform-origin:top left}.wall img{display:block;max-width:none}.wall svg{position:absolute;inset:0;width:100%;height:100%}button,select{width:100%;padding:9px;border:1px solid var(--ink);background:var(--card);font:13px system-ui;margin:5px 0;cursor:pointer}button.primary,button.active{background:var(--lime);font-weight:bold}.tool{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.tool h2{font-size:16px;margin:0 0 7px}.note{font:12px system-ui;color:#536158;line-height:1.5}polygon{fill:#77c94b44;stroke:#3d8b38;stroke-width:3;vector-effect:non-scaling-stroke;cursor:pointer}polygon.selected{fill:#e9857c77;stroke:var(--red)}polyline.draft{fill:#a7e75d55;stroke:#17211d;stroke-width:3;vector-effect:non-scaling-stroke}.results{margin-top:20px;background:var(--card);border:1px solid var(--line);box-shadow:4px 4px #cbd5c9;padding:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;text-align:left;border-bottom:1px solid var(--line)}@media(max-width:900px){.grid{grid-template-columns:1fr}.stage{min-height:450px}.panel{box-shadow:none}}</style><body><div class="bar"><span class="brand">SPRAYWALL / LAB</span><a href="/">← 实验档案</a><span>04 / 人工校准</span></div><main class="shell"><div class="head"><span class="num">04</span><h1>人工校准</h1></div><div class="grid"><aside class="panel"><b>来源分割结果</b><select id="task"></select><button id="load" class="primary">加载候选</button><p class="note">每次保存都会建立新的校准结果，来源任务保持不变。</p><div class="tool"><h2>已保存结果</h2><div id="saved"></div></div></aside><section class="stage" id="stage"><div class="wall" id="wall"><img id="image"><svg id="overlay"></svg></div></section><aside class="panel"><b>编辑工具</b><button id="select" class="active">选择 / 删除</button><button id="add">新增岩点</button><button id="finish" disabled>完成新增多边形</button><div class="tool"><button id="delete">删除选中岩点</button><button id="save" class="primary">保存为校准结果</button><p id="status" class="note">请先选择一条已完成任务。</p></div></aside></div><section class="results"><b>已保存校准结果</b><table class="table"><thead><tr><th>校准 ID</th><th>来源任务</th><th>保存时间</th><th>岩点</th><th>操作</th></tr></thead><tbody id="calibrations"><tr><td colspan="5">尚无结果</td></tr></tbody></table></section></main><script>let tasks=[],experimentId,taskId,candidates=[],selectedId,mode='select',draft=[];const task=document.querySelector('#task'),image=document.querySelector('#image'),wall=document.querySelector('#wall'),overlay=document.querySelector('#overlay'),status=document.querySelector('#status'),saved=document.querySelector('#saved'),calibrations=document.querySelector('#calibrations');function msg(t){status.textContent=t}function render(){overlay.innerHTML=candidates.map(c=>`<polygon class="${c.id===selectedId?'selected':''}" data-id="${c.id}" points="${c.polygon.map(p=>p.join(',')).join(' ')}"/>`).join('')+(draft.length?`<polyline class="draft" points="${draft.map(p=>p.join(',')).join(' ')}"/>`:'');overlay.querySelectorAll('polygon').forEach(p=>p.onclick=()=>{if(mode==='select'){selectedId=p.dataset.id;render();msg('已选择岩点，可删除。')}})}async function bootstrap(){let data=await(await fetch('/api/experiments')).json();tasks=data.items.flatMap(e=>Object.entries(e.runs).filter(([,r])=>r.status==='succeeded').map(([id,r])=>({e,id,r})));task.innerHTML=tasks.map((t,i)=>`<option value="${i}">${t.e.image.name} · ${t.r.model||t.id}</option>`).join('')||'<option>没有已完成任务</option>'}async function loadTask(){let entry=tasks[task.value];if(!entry)return;experimentId=entry.e.id;taskId=entry.id;let data=await(await fetch(`/api/experiments/${experimentId}/candidates?source=${taskId}`)).json();candidates=data.items;image.src=`/api/experiments/${experimentId}/image`;image.onload=()=>{wall.style.width=image.naturalWidth+'px';wall.style.height=image.naturalHeight+'px';overlay.setAttribute('viewBox',`0 0 ${image.naturalWidth} ${image.naturalHeight}`);render()};msg(`已载入 ${candidates.length} 个候选岩点。`);listCalibrations()}async function listCalibrations(){if(!experimentId)return;let data=await(await fetch(`/api/experiments/${experimentId}/calibrations`)).json();let rows=data.items;calibrations.innerHTML=rows.map(c=>`<tr><td>${c.id.slice(0,8)}</td><td>${c.sourceTaskId.slice(0,8)}</td><td>${new Date(c.updatedAt*1000).toLocaleString()}</td><td>${c.candidateCount}</td><td><button onclick="openCalibration('${c.id}')">继续校准</button> <a href="/api/experiments/${experimentId}/calibrations/${c.id}/export.svg">SVG</a></td></tr>`).join('')||'<tr><td colspan="5">尚无结果</td></tr>';saved.innerHTML=rows.map(c=>`<button onclick="openCalibration('${c.id}')">${c.id.slice(0,8)} · ${c.candidateCount} 点</button>`).join('')||'<span class="note">尚无结果</span>'}async function openCalibration(id){let data=await(await fetch(`/api/experiments/${experimentId}/calibrations/${id}`)).json();candidates=data.items;selectedId=undefined;render();msg(`已打开校准结果 ${id.slice(0,8)}，继续修改后再次保存。`)}document.querySelector('#load').onclick=loadTask;document.querySelector('#select').onclick=()=>{mode='select';draft=[];document.querySelector('#select').classList.add('active');document.querySelector('#add').classList.remove('active');render()};document.querySelector('#add').onclick=()=>{mode='add';draft=[];document.querySelector('#add').classList.add('active');document.querySelector('#select').classList.remove('active');document.querySelector('#finish').disabled=true;msg('在墙图上连续点击至少三个点，勾勒新岩点边界。')};overlay.onclick=e=>{if(mode!=='add'||e.target!==overlay)return;let r=overlay.getBoundingClientRect(),x=(e.clientX-r.left)*image.naturalWidth/r.width,y=(e.clientY-r.top)*image.naturalHeight/r.height;draft.push([Math.round(x),Math.round(y)]);document.querySelector('#finish').disabled=draft.length<3;render()};document.querySelector('#finish').onclick=()=>{if(draft.length<3)return;candidates.push({id:`manual-${crypto.randomUUID()}`,polygon:draft,score:null,metadata:{manual:true}});draft=[];document.querySelector('#finish').disabled=true;render();msg('已新增岩点。')};document.querySelector('#delete').onclick=()=>{if(!selectedId)return;let before=candidates.length;candidates=candidates.filter(c=>c.id!==selectedId);selectedId=undefined;render();msg(`已删除 ${before-candidates.length} 个岩点。`)};document.querySelector('#save').onclick=async()=>{if(!experimentId)return;let response=await fetch(`/api/experiments/${experimentId}/calibrations`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceTaskId:taskId,candidates,changes:{}})});if(!response.ok){msg('保存失败。');return}msg('校准结果已保存为新记录。');listCalibrations()};bootstrap();</script></body></html>
