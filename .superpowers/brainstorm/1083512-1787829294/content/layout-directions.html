<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CruxSet · 三栏布局方向</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eceae5; color: #182018; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 1260px; margin: 0 auto; padding: 42px 26px 58px; }
    .kicker { font-size: 12px; font-weight: 800; letter-spacing: .16em; color: #748070; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 4vw, 48px); margin: 9px 0 10px; letter-spacing: -.045em; }
    .intro { max-width: 700px; margin: 0 0 32px; color: #5a6559; line-height: 1.65; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(270px, 1fr)); gap: 20px; }
    .direction { border: 0; padding: 0; text-align: left; background: transparent; cursor: pointer; border-radius: 28px; }
    .direction:focus-visible { outline: 3px solid #e77536; outline-offset: 5px; }
    .phone { min-height: 600px; padding: 20px; border-radius: 28px; overflow: hidden; position: relative; box-shadow: 0 16px 38px rgba(27, 35, 25, .16); }
    .phone * { pointer-events: none; }
    .topline { display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:800; letter-spacing:.08em; opacity:.68; }
    .hero { margin: 32px 0 20px; }
    .hero h2 { font-size: 38px; letter-spacing: -.06em; margin: 0 0 8px; }
    .hero p { margin: 0; font-size: 14px; line-height: 1.5; opacity:.72; }
    .section { font-size: 12px; font-weight: 800; letter-spacing:.08em; opacity:.65; margin: 18px 0 9px; }
    .card { padding: 16px; border-radius: 18px; margin-bottom: 10px; }
    .card-title { display:flex; justify-content:space-between; gap:10px; font-size:17px; font-weight:800; }
    .meta { margin-top: 8px; font-size: 12px; opacity:.68; }
    .cta { display:inline-block; margin-top:14px; padding:11px 14px; border-radius:12px; font-size:13px; font-weight:800; }
    .tabs { position:absolute; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(3, 1fr); padding:12px 18px 17px; text-align:center; font-size:12px; font-weight:800; }
    .tabs span:first-child { opacity:1; }
    .tabs span:not(:first-child) { opacity:.46; }
    .label { padding: 16px 5px 0; }
    .label h3 { margin:0; font-size:20px; letter-spacing:-.03em; }
    .label p { margin:7px 0 0; color:#606960; font-size:14px; line-height:1.5; }
    .a .phone { background:#f5f1e8; color:#1a291e; }
    .a .card { background:#fffdf7; box-shadow:0 8px 18px rgba(32,41,30,.08); }
    .a .cta { background:#e67234; color:#fffaf1; }
    .a .tabs { background:#1c2a20; color:#f7f4ec; }
    .a .badge { color:#4c6d50; }
    .b .phone { background:#f7f7f5; color:#111312; }
    .b .hero { border-left:4px solid #111312; padding-left:14px; }
    .b .card { border:1px solid #d7dad5; border-radius:6px; background:#fff; }
    .b .cta { background:#111312; color:#fff; border-radius:5px; }
    .b .tabs { background:#fff; border-top:1px solid #d7dad5; }
    .c .phone { background:linear-gradient(165deg, #eef8ff 0%, #fff5e9 57%, #f7efff 100%); color:#21213a; }
    .c .card { background:rgba(255,255,255,.84); border:1px solid rgba(78,61,130,.12); box-shadow:0 10px 25px rgba(55,42,105,.09); }
    .c .cta { background:#6344d9; color:white; border-radius:999px; }
    .c .tabs { background:#28214b; color:#fff; }
    .chip { display:inline-block; margin-top:10px; border-radius:999px; padding:5px 8px; font-size:11px; font-weight:800; background:rgba(94,128,98,.13); }
    .b .chip { background:#ecefeb; }.c .chip { background:#eee8ff; color:#6344d9; }
    .tip { margin-top: 35px; background:#fff; border-radius:18px; padding:17px 19px; color:#535d53; font-size:14px; line-height:1.55; }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; } }
  </style>
</head>
<body>
  <main>
    <div class="kicker">CruxSet · UI direction</div>
    <h1>先选气质，再统一三栏体验。</h1>
    <p class="intro">三个方向都保留“线路 / 创建 / 我的”的功能结构；差异在信息层级、颜色和运动感。点击任一方向即可选择。</p>
    <section class="grid">
      <button class="direction a" data-choice="A 岩馆训练日志感">
        <div class="phone"><div class="topline"><span>CRUXSET</span><span>01 / 03</span></div><div class="hero"><h2>找线路</h2><p>选择一面墙，开始今天的训练。</p></div><div class="section">公开墙面</div><div class="card"><div class="card-title"><span>日坛 Spraywall</span><span class="badge">公开</span></div><div class="meta">35° · 24 个岩点 · 4 条线路</div><span class="chip">最近更新</span></div><div class="card"><div class="card-title"><span>东侧训练墙</span><span>›</span></div><div class="meta">可按难度或编号浏览</div></div><span class="cta">浏览线路 →</span><div class="tabs"><span>线路</span><span>创建</span><span>我的</span></div></div>
        <div class="label"><h3>A · 岩馆训练日志</h3><p>暖石灰底、深绿文字、橙色行动按钮；克制、有真实岩馆感。</p></div>
      </button>
      <button class="direction b" data-choice="B 极简专业工具">
        <div class="phone"><div class="topline"><span>CRUXSET</span><span>LINE LIBRARY</span></div><div class="hero"><h2>线路</h2><p>当前可浏览 8 面公开墙。</p></div><div class="section">墙面列表 / 08</div><div class="card"><div class="card-title"><span>01 日坛 Spraywall</span><span>→</span></div><div class="meta">35° · 24 Holds · Published</div></div><div class="card"><div class="card-title"><span>02 东侧训练墙</span><span>→</span></div><div class="meta">20° · 48 Holds · Published</div></div><span class="cta">筛选线路</span><div class="tabs"><span>线路</span><span>创建</span><span>我的</span></div></div>
        <div class="label"><h3>B · 极简专业工具</h3><p>黑白灰、细边框、较高信息密度；像训练器材的控制面板。</p></div>
      </button>
      <button class="direction c" data-choice="C 明亮社群感">
        <div class="phone"><div class="topline"><span>☀ CRUXSET</span><span>今天去爬</span></div><div class="hero"><h2>选一条来爬</h2><p>发现附近攀岩者分享的墙面与线路。</p></div><div class="section">推荐墙面</div><div class="card"><div class="card-title"><span>日坛 Spraywall</span><span>✦</span></div><div class="meta">35° · 24 个岩点 · 新增 2 条线路</div><span class="chip">朋友也在爬</span></div><div class="card"><div class="card-title"><span>周末训练墙</span><span>›</span></div><div class="meta">从 V2 到 V6</div></div><span class="cta">随机来一条</span><div class="tabs"><span>线路</span><span>创建</span><span>我的</span></div></div>
        <div class="label"><h3>C · 明亮社群感</h3><p>更轻盈、更活泼；适合未来扩展分享、记录与训练活动。</p></div>
      </button>
    </section>
    <p class="tip">建议选择 A：它能保留攀岩墙的质感，又不会牺牲阅读效率；后续“创建”和“我的”也能沿用同一套颜色与层级。</p>
  </main>
  <script>
    document.querySelectorAll('[data-choice]').forEach((item) => item.addEventListener('click', () => {
      document.body.dataset.choice = item.dataset.choice;
      item.style.outline = '4px solid #e67234';
      item.style.outlineOffset = '5px';
      document.querySelectorAll('[data-choice]').forEach((other) => { if (other !== item) other.style.outline = ''; });
      document.title = item.dataset.choice + ' · 已选择';
    }));
  </script>
</body>
</html>
