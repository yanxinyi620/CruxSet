[project]
name = "cruxset-api"
version = "0.1.0"
description = "CruxSet unified API"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "fastapi>=0.115.0",
  "itsdangerous>=2.2.0",
  "pydantic>=2.9.0",
  "tencentcloud-sdk-python-tcb>=3.1.166",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--capture=sys"
